name: capture linkedin draft text only (temp, no email)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install anthropic
      - name: Generate draft text only, write to file, do NOT email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scraper")
          from linkedin_draft import get_latest_post, parse_post, generate_linkedin_post

          post_path = get_latest_post()
          title, content = parse_post(post_path)
          draft = generate_linkedin_post(title, content)

          with open("_tmp_draft_output.txt", "w", encoding="utf-8") as f:
              f.write(f"SOURCE_TITLE: {title}\n")
              f.write(f"SOURCE_FILE: {post_path}\n")
              f.write("---DRAFT---\n")
              f.write(draft)
          print("wrote _tmp_draft_output.txt, len=", len(draft))
          PY
      - name: Commit output for inspection
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"
          git add _tmp_draft_output.txt
          git commit -m "temp: captured linkedin draft text for review"
          git push
